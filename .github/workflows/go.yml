name: CI - Go

on:
  push:
    branches:
      - "main"
    paths:
      - "api/go/**"
      - ".github/workflows/go.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "api/go/**"
      - ".github/workflows/go.yml"

jobs:
  build:
    name: Build (Go v${{ matrix.go }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:19-alpine
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
      redis:
        image: docker.io/library/redis:7.2.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    strategy:
      matrix:
        go: ["1.27"]
    env:
      FOLDER: api/go
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: ${{ env.FOLDER }}/go.sum

      - name: Download dependencies
        working-directory: ${{ env.FOLDER }}
        run: go mod download

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true

      - name: Check formatting
        working-directory: ${{ env.FOLDER }}
        run: golangci-lint fmt --diff

      - name: Run lint
        working-directory: ${{ env.FOLDER }}
        run: golangci-lint run

      - name: Run build
        working-directory: ${{ env.FOLDER }}
        run: go build ./...

      - name: Run tests
        working-directory: ${{ env.FOLDER }}
        run: go test -p 1 ./...
