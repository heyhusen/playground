name: CI - Go

on:
  push:
    branches:
      - "main"
    paths:
      - "api/go/**"
      - ".github/workflows/go.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "api/go/**"
      - ".github/workflows/go.yml"

jobs:
  build:
    name: Build (Go v${{ matrix.go }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:17-alpine
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
    strategy:
      matrix:
        go: ["1.27"]
    env:
      FOLDER: api/go

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: ${{ env.FOLDER }}/go.sum

      - name: Download dependencies
        working-directory: ${{ env.FOLDER }}
        run: go mod download

      - name: Check formatting
        working-directory: ${{ env.FOLDER }}
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        working-directory: ${{ env.FOLDER }}
        run: go vet ./...

      - name: Run build
        working-directory: ${{ env.FOLDER }}
        run: go build ./...

      - name: Run tests
        working-directory: ${{ env.FOLDER }}
        run: go test -p 1 ./...
